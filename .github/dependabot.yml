version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Expo SDK packages move together; separate PRs for each would conflict.
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "@expo-google-fonts/*"
      react-native:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native-community/*"
    ignore:
      # These are pinned by the Expo SDK; bump them with `npx expo install --fix`
      # rather than independently, or the native build stops matching.
      - dependency-name: "react"
      - dependency-name: "react-native"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
